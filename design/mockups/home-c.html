<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Nova TV: главная, вариант C</title>
<link rel="stylesheet" href="common.css">
<style>
  .clock { position: absolute; left: 110px; top: 80px; font-size: 150px; font-weight: 200; letter-spacing: -.05em; line-height: 1; }
  .date { position: absolute; left: 116px; top: 244px; font-size: 32px; color: var(--muted); }
  .chips { position: absolute; right: 110px; top: 96px; display: flex; gap: 14px; }
  .card { position: absolute; left: 110px; right: 110px; top: 360px; height: 340px; border-radius: 44px; overflow: hidden; display: flex; background: rgba(22,27,54,.85); box-shadow: 0 50px 120px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.14); }
  .art { width: 640px; position: relative; background: radial-gradient(500px 360px at 70% 30%, #4a6ae0 0%, rgba(74,106,224,0) 70%), linear-gradient(130deg, #1e2a6c, #3a4fb8); }
  .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(22,27,54,0) 60%, rgba(22,27,54,.95) 100%); }
  .body { flex: 1; padding: 0 70px; display: flex; flex-direction: column; justify-content: center; }
  .kick { font-size: 24px; font-weight: 700; color: #9bb6ff; margin-bottom: 8px; letter-spacing: .02em; }
  .title { font-size: 66px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
  .sub { font-size: 28px; color: rgba(238,241,248,.78); margin: 12px 0 18px; }
  .dock { position: absolute; left: 0; right: 0; bottom: 100px; display: flex; justify-content: center; gap: 18px; }
  .cap { display: inline-flex; align-items: center; gap: 16px; padding: 26px 50px; border-radius: 99px; font-size: 32px; font-weight: 700; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); color: rgba(238,241,248,.9); backdrop-filter: blur(14px); }
  .cap .ic { font-size: 40px; }
  .cap.on { background: #fff; color: #0b0e17; transform: scale(1.06); box-shadow: 0 24px 60px rgba(110,155,255,.4); }
</style>
</head>
<body>
<div class="screen">
  <div class="amb" style="left:-260px;top:-300px;width:900px;height:800px;background:#2447b8;opacity:.6"></div>
  <div class="amb" style="right:-300px;bottom:-340px;width:1000px;height:900px;background:#6a30c0;opacity:.5"></div>

  <div class="clock">21:40</div>
  <div class="date">Добрый вечер · вторник, 27 октября</div>
  <div class="chips">
    <span class="chip"><i data-i="gamepad"></i>Геймпад</span>
    <span class="chip"><i data-i="phone"></i>Телефон</span>
    <span class="chip acc"><i data-i="download"></i>Обновление 0.2.0</span>
  </div>

  <div class="card">
    <div class="art"></div>
    <div class="body">
      <div class="kick">ПРОДОЛЖИТЬ</div>
      <div class="title">Бесстыжие</div>
      <div class="sub">Сезон 3 · серия 3 · осталось 30 минут</div>
      <div class="bar" style="width:440px;margin-bottom:26px"><i style="width:42%"></i></div>
      <div><span class="btn p"><i data-i="play"></i>Продолжить</span></div>
    </div>
  </div>

  <div class="dock">
    <span class="cap on"><i data-i="play"></i>YouTube</span>
    <span class="cap"><i data-i="film"></i>Фильмы</span>
    <span class="cap"><i data-i="globe"></i>Браузер</span>
    <span class="cap"><i data-i="sliders"></i>Настройки</span>
    <span class="cap"><i data-i="power"></i></span>
  </div>
</div>
<script src="icons.js"></script>
<script>document.querySelectorAll('i[data-i]').forEach((e) => { e.outerHTML = ic(e.dataset.i); });</script>
</body>
</html>
