name: Сборка

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: |
              release/*.exe
          - os: macos-latest
            script: dist:mac
            files: |
              release/*.dmg
          - os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v1.2.3 (three numbers), got $GITHUB_REF_NAME"
            exit 1
          fi
          npm version "$TAG" --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.files }}

  android-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag format
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "${GITHUB_REF_NAME#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag must look like v1.2.3 (three numbers), got $GITHUB_REF_NAME"; exit 1; }
      - name: Build Nova TV Remote APK
        working-directory: remote
        run: |
          flutter create --platforms=android --project-name=novatv_remote --org=com.novatv .
          git checkout -- lib pubspec.yaml analysis_options.yaml
          node tool/setup.js
          flutter pub get
          # Постоянный ключ подписи берём из секретов репозитория (без него APK получит случайный отладочный ключ)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/novatv.jks"
            export NOVATV_KEYSTORE="$RUNNER_TEMP/novatv.jks"
          fi
          flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk ../NovaTV-Remote-${{ github.ref_name }}.apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          NOVATV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOVATV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: NovaTV-Remote-*.apk
